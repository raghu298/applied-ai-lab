<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1060" viewBox="0 0 900 1060" font-family="'Marker Felt','Chalkboard SE','Comic Sans MS',cursive">
  <defs>
    <filter id="rough" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.015" numOctaves="3" seed="5" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="2" seed="17" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="3" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>

  <rect width="900" height="1060" fill="#fbfaf5"/>

  <!-- title -->
  <g filter="url(#rough2)"><rect x="52" y="42" width="500" height="30" fill="#ffe066" opacity="0.55"/></g>
  <text x="56" y="70" font-size="40" fill="#23262e">I built an AI agent from scratch</text>
  <text x="58" y="104" font-size="20" fill="#6b7280">…that runs 100% on a local open-source model — no API key, no cloud.</text>

  <!-- helper defs via reuse: boxes drawn inline -->

  <!-- YOU -->
  <g filter="url(#rough)">
    <rect x="330" y="140" width="240" height="52" rx="10" fill="#eef4ff" stroke="#3b6fd1" stroke-width="2.4"/>
  </g>
  <text x="450" y="173" font-size="21" fill="#23262e" text-anchor="middle">you — in your terminal</text>

  <!-- arrow down -->
  <g filter="url(#rough)" stroke="#8a8f99" stroke-width="2.2" fill="none">
    <path d="M450 192 L450 224"/><path d="M450 224 l-7 -12 M450 224 l7 -12"/>
  </g>
  <text x="470" y="216" font-size="15" fill="#8a8f99">type a message</text>

  <!-- HOST -->
  <g filter="url(#rough)"><rect x="300" y="228" width="300" height="46" rx="9" fill="#f3f0e6" stroke="#6b7280" stroke-width="2.2"/></g>
  <text x="450" y="257" font-size="19" fill="#23262e" text-anchor="middle">host process</text>

  <!-- inbound.db cylinder -->
  <g filter="url(#rough)" stroke="#c0392b" stroke-width="2.4" fill="#fdecec">
    <ellipse cx="450" cy="316" rx="120" ry="16"/>
    <path d="M330 316 L330 350 A120 16 0 0 0 570 350 L570 316" fill="#fdecec"/>
    <ellipse cx="450" cy="316" rx="120" ry="16" fill="#fdecec"/>
  </g>
  <text x="450" y="322" font-size="18" fill="#c0392b" text-anchor="middle" font-weight="bold">inbound.db</text>
  <text x="450" y="345" font-size="13.5" fill="#a05" text-anchor="middle">host writes even seqs: 2, 4, 6…</text>

  <!-- bus label -->
  <g filter="url(#rough2)"><rect x="612" y="300" width="238" height="70" rx="8" fill="#fff9e6" stroke="#c9a227" stroke-width="2"/></g>
  <text x="626" y="326" font-size="16" fill="#5b4a12">two SQLite files ARE</text>
  <text x="626" y="348" font-size="16" fill="#5b4a12">the message bus —</text>
  <text x="626" y="366" font-size="14.5" fill="#5b4a12">no sockets, crash-safe</text>
  <g filter="url(#rough)" stroke="#c9a227" stroke-width="2" fill="none"><path d="M612 335 L576 335"/></g>

  <!-- arrow to loop -->
  <g filter="url(#rough)" stroke="#8a8f99" stroke-width="2.2" fill="none">
    <path d="M450 380 L450 414"/><path d="M450 414 l-7 -12 M450 414 l7 -12"/>
  </g>
  <text x="470" y="405" font-size="15" fill="#8a8f99">worker polls every 500ms</text>

  <!-- THE AGENT LOOP (hero) -->
  <g filter="url(#rough)"><rect x="150" y="420" width="600" height="248" rx="16" fill="#eafaf1" stroke="#1f9d55" stroke-width="2.8"/></g>
  <text x="450" y="456" font-size="24" fill="#136c3a" text-anchor="middle" font-weight="bold">the agent loop</text>

  <!-- plan act observe cycle -->
  <text x="230" y="512" font-size="21" fill="#23262e">plan</text>
  <text x="316" y="512" font-size="20" fill="#8a8f99">→</text>
  <text x="352" y="512" font-size="21" fill="#23262e">act</text>
  <text x="420" y="512" font-size="20" fill="#8a8f99">→</text>
  <text x="456" y="512" font-size="21" fill="#23262e">observe</text>
  <g filter="url(#rough)" stroke="#1f9d55" stroke-width="2.2" fill="none">
    <path d="M578 505 q34 8 0 16"/><path d="M578 521 l10 -3 M578 521 l-2 -11"/>
  </g>
  <text x="600" y="516" font-size="14" fill="#136c3a">repeat</text>
  <text x="450" y="548" font-size="15" fill="#6b7280" text-anchor="middle">…until it answers with plain text and no tool call. that's the whole trick.</text>

  <!-- tools + brain -->
  <g filter="url(#rough2)"><rect x="182" y="572" width="300" height="72" rx="10" fill="#ffffff" stroke="#6b7280" stroke-width="2"/></g>
  <text x="198" y="596" font-size="15.5" fill="#23262e" font-weight="bold">tools it can call</text>
  <text x="198" y="620" font-size="15" fill="#444">run_bash · read/write files</text>
  <text x="198" y="638" font-size="15" fill="#444">remember (writes to memory)</text>

  <g filter="url(#rough2)"><rect x="500" y="572" width="230" height="72" rx="10" fill="#f0ecff" stroke="#6b46c1" stroke-width="2"/></g>
  <text x="516" y="596" font-size="15.5" fill="#4c2d91" font-weight="bold">brain</text>
  <text x="516" y="620" font-size="15" fill="#4c2d91">gpt-oss-20b</text>
  <text x="516" y="638" font-size="14" fill="#6b46c1">running on my laptop</text>

  <!-- arrow down to outbound -->
  <g filter="url(#rough)" stroke="#8a8f99" stroke-width="2.2" fill="none">
    <path d="M450 668 L450 700"/><path d="M450 700 l-7 -12 M450 700 l7 -12"/>
  </g>

  <!-- outbound.db cylinder -->
  <g filter="url(#rough)" stroke="#1d4ed8" stroke-width="2.4" fill="#eaf0ff">
    <ellipse cx="450" cy="720" rx="120" ry="16"/>
    <path d="M330 720 L330 752 A120 16 0 0 0 570 752 L570 720" fill="#eaf0ff"/>
    <ellipse cx="450" cy="720" rx="120" ry="16" fill="#eaf0ff"/>
  </g>
  <text x="450" y="726" font-size="18" fill="#1d4ed8" text-anchor="middle" font-weight="bold">outbound.db</text>
  <text x="450" y="748" font-size="13.5" fill="#2952c8" text-anchor="middle">worker writes odd seqs: 1, 3, 5…</text>

  <!-- back to host / reply -->
  <g filter="url(#rough)" stroke="#8a8f99" stroke-width="2.2" fill="none">
    <path d="M450 768 L450 796"/><path d="M450 796 l-7 -12 M450 796 l7 -12"/>
  </g>
  <g filter="url(#rough)"><rect x="330" y="800" width="240" height="46" rx="9" fill="#eef4ff" stroke="#3b6fd1" stroke-width="2.2"/></g>
  <text x="450" y="829" font-size="18" fill="#23262e" text-anchor="middle">reply prints back to you</text>

  <!-- two sticky notes -->
  <g filter="url(#rough2)"><rect x="70" y="888" width="360" height="120" rx="8" fill="#fff4d6" stroke="#c9a227" stroke-width="2"/></g>
  <text x="90" y="918" font-size="18" fill="#5b4a12" font-weight="bold">memory that outlasts the chat</text>
  <text x="90" y="946" font-size="15.5" fill="#5b4a12">the agent saves facts to AGENT.md.</text>
  <text x="90" y="968" font-size="15.5" fill="#5b4a12">restart it, and it still knows your</text>
  <text x="90" y="990" font-size="15.5" fill="#5b4a12">name. no database, just a file.</text>

  <g filter="url(#rough2)"><rect x="470" y="888" width="360" height="120" rx="8" fill="#fdecec" stroke="#c0392b" stroke-width="2"/></g>
  <text x="490" y="918" font-size="18" fill="#8a2020" font-weight="bold">it can't touch your machine</text>
  <text x="490" y="946" font-size="15.5" fill="#8a2020">…without asking. every shell</text>
  <text x="490" y="968" font-size="15.5" fill="#8a2020">command stops for approval:</text>
  <text x="490" y="990" font-size="15.5" fill="#8a2020" font-weight="bold">allow? [y/N]</text>

  <text x="56" y="1042" font-size="15" fill="#9aa0ab">~350 lines of Python · nanoclaw-mini · built from the "Build Your Own AI Agent" handbook</text>
</svg>
