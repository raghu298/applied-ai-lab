<svg xmlns="http://www.w3.org/2000/svg" width="900" height="820" viewBox="0 0 900 820" font-family="'Marker Felt','Chalkboard SE','Comic Sans MS',cursive">
  <defs>
    <filter id="rough" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.015" numOctaves="3" seed="5" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="2" seed="17" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="3" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>

  <rect width="900" height="820" fill="#fbfaf5"/>

  <!-- title -->
  <g filter="url(#rough2)"><rect x="52" y="42" width="470" height="30" fill="#ffe066" opacity="0.55"/></g>
  <text x="56" y="70" font-size="38" fill="#23262e">How an AI agent actually works</text>
  <text x="58" y="104" font-size="20" fill="#6b7280">The ReAct loop — Reason + Act — behind almost every AI agent.</text>

  <!-- entry: user question -->
  <g filter="url(#rough)"><rect x="60" y="200" width="200" height="52" rx="10" fill="#eef4ff" stroke="#3b6fd1" stroke-width="2.4"/></g>
  <text x="160" y="233" font-size="19" fill="#23262e" text-anchor="middle">a question comes in</text>
  <g filter="url(#rough)" stroke="#8a8f99" stroke-width="2.4" fill="none">
    <path d="M262 226 L330 226"/><path d="M330 226 l-13 -7 M330 226 l-13 7"/>
  </g>

  <!-- REASON node (top) -->
  <g filter="url(#rough)"><rect x="335" y="188" width="240" height="78" rx="14" fill="#eafaf1" stroke="#1f9d55" stroke-width="2.8"/></g>
  <text x="455" y="222" font-size="23" fill="#136c3a" text-anchor="middle" font-weight="bold">1 · REASON</text>
  <text x="455" y="248" font-size="15.5" fill="#3a6b50" text-anchor="middle">"what should I do next?"</text>

  <!-- ACT node (bottom right) -->
  <g filter="url(#rough)"><rect x="560" y="470" width="240" height="78" rx="14" fill="#fff2e0" stroke="#d4791f" stroke-width="2.8"/></g>
  <text x="680" y="504" font-size="23" fill="#a5560f" text-anchor="middle" font-weight="bold">2 · ACT</text>
  <text x="680" y="530" font-size="15.5" fill="#8a5b25" text-anchor="middle">call a tool</text>

  <!-- OBSERVE node (bottom left) -->
  <g filter="url(#rough)"><rect x="110" y="470" width="240" height="78" rx="14" fill="#f0ecff" stroke="#6b46c1" stroke-width="2.8"/></g>
  <text x="230" y="504" font-size="23" fill="#4c2d91" text-anchor="middle" font-weight="bold">3 · OBSERVE</text>
  <text x="230" y="530" font-size="15.5" fill="#5b3fa0" text-anchor="middle">read the result</text>

  <!-- cyclic arrows: REASON -> ACT -> OBSERVE -> REASON -->
  <g filter="url(#rough)" stroke="#8a8f99" stroke-width="2.6" fill="none">
    <!-- reason -> act (right, curving down) -->
    <path d="M575 250 C 700 300, 720 400, 690 466"/>
    <path d="M690 466 l 11 -9 M690 466 l -12 -6"/>
    <!-- act -> observe (bottom, right to left) -->
    <path d="M558 512 L 352 512"/>
    <path d="M352 512 l 13 -7 M352 512 l 13 7"/>
    <!-- observe -> reason (left, curving up) -->
    <path d="M220 468 C 190 400, 210 300, 335 252"/>
    <path d="M335 252 l -13 1 M335 252 l -5 -12"/>
  </g>
  <text x="455" y="500" font-size="15" fill="#9aa0ab" text-anchor="middle">repeat until it has the answer</text>

  <!-- tools callout near ACT -->
  <g filter="url(#rough2)"><rect x="590" y="576" width="270" height="96" rx="8" fill="#fff9e6" stroke="#c9a227" stroke-width="2"/></g>
  <text x="606" y="602" font-size="15.5" fill="#5b4a12">a "tool" is any action:</text>
  <text x="606" y="626" font-size="15" fill="#5b4a12">search · run code · call an API</text>
  <text x="606" y="648" font-size="15" fill="#5b4a12">query a database · do math</text>
  <g filter="url(#rough)" stroke="#c9a227" stroke-width="2" fill="none"><path d="M680 576 L680 550"/></g>

  <!-- exit: final answer -->
  <g filter="url(#rough)" stroke="#1f9d55" stroke-width="2.6" fill="none">
    <path d="M455 186 L455 150"/><path d="M455 150 l -7 12 M455 150 l 7 12"/>
  </g>
  <g filter="url(#rough)"><rect x="330" y="104" width="250" height="46" rx="10" fill="#eafaf1" stroke="#1f9d55" stroke-width="2.4"/></g>
  <text x="455" y="133" font-size="18" fill="#136c3a" text-anchor="middle">done → final answer</text>

  <!-- bottom line -->
  <text x="60" y="726" font-size="21" fill="#23262e">The magic isn't the model. It's the <tspan fill="#136c3a" font-weight="bold">loop.</tspan></text>
  <text x="60" y="756" font-size="16" fill="#6b7280">Multi-step research, self-correction, tool use — all of it emerges from Reason → Act → Observe.</text>
  <text x="60" y="792" font-size="14.5" fill="#9aa0ab">ReAct architecture · Yao et al., 2022 · the pattern under most modern AI agents</text>
</svg>
